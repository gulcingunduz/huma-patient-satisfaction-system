services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hbys}
      POSTGRES_USER: ${POSTGRES_USER:-hbys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hbys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hbys}
      DB_USERNAME: ${POSTGRES_USER:-hbys}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      HBYS_ADMIN_USERNAME: ${HBYS_ADMIN_USERNAME:?Set HBYS_ADMIN_USERNAME in .env}
      HBYS_ADMIN_PASSWORD: ${HBYS_ADMIN_PASSWORD:?Set HBYS_ADMIN_PASSWORD in .env}
      HBYS_AI_PROVIDER: ${HBYS_AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      HBYS_RATE_LIMIT_ENABLED: ${HBYS_RATE_LIMIT_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/auth/csrf HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  hbys-postgres-data:
